name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            dependencies: Highest
            composer_options: ''
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
            dependencies: Highest
            composer_options: ''
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
            dependencies: Highest
            composer_options: ''
          - php: '8.5'
            laravel: '12'
            testbench: '^10.0'
            dependencies: Highest
            composer_options: ''
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            dependencies: Highest
            composer_options: ''
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
            dependencies: Highest
            composer_options: ''
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'
            dependencies: Highest
            composer_options: ''
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            dependencies: Lowest
            composer_options: '--prefer-lowest'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            dependencies: Lowest
            composer_options: '--prefer-lowest'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Select Testbench version
        run: composer require --dev --no-interaction --no-update "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.composer_options }}

      - name: Run package checks
        run: composer check
